        prompt_template:
        - id: sys-prompt-chunk
          role: system
          text: '你是火电设备技术协议评审助手。你会收到技术协议OCR全文中的一小段文本，任务：按照下面的关键字表，从本段文本中提取命中关键字的原文条款及参数。


            关键字表（类别-关键字）：

            质检类：试验、检验、检测、高出/高、尺寸/规格、壁厚/厚度、表面、偏差、%、℃/摄氏度、强度、离地、漆、供应商短名单、见证项目表/见证提前通知时间、长/长度、容积、度/°、宽/宽度

            材质类：304、316、不锈钢、2205、NM、耐磨、料、铸钢、ND

            工艺类：衬、喷、涂、附、镀、球节

            供货类：进口、封闭、保温、换热、一备一用、标牌/铭牌

            材料类：证明、单据、报关单、说明书、报告、手册、合格证、文件、资料、其他


            提取规则：

            1. 凡是本段中命中关键字的条款，完整摘录原文（保留条款编号，如 2.1.2、3.1.2 a），禁止改写、禁止编造、禁止总结。

            2. 每个关键字最多提取5条，优先提取含具体参数或数值的条款（如厚度、温度、压力、流速、材质牌号、比例、寿命数值等）。

            3. 同一段原文命中多个关键字时，在每个关键字下分别记录。

            4. 关键字中的"/"表示任一写法都算命中，例如"壁厚/厚度"命中"壁厚"、"厚度"。

            5. 只输出本段命中的关键字条目；本段没有命中任何关键字时输出 []。

            6. 仅输出JSON数组，不要输出解释文字或代码块标记。格式：

            [{"类别":"质检类","关键字":"试验","摘录":["原文1","原文2"]}]'
        - id: user-prompt-chunk
          role: user
          text: '技术协议OCR文本片段如下：


            {{#1780000001000.item#}}'
        selected: true
        title: 分块提取
        type: llm
        vision:
          enabled: false
      draggable: true
