    - data:
        code: "import json\n\nKEYWORDS = {\n    \"质检类\": [\"试验\", \"检验\", \"检测\",\
          \ \"高出/高\", \"尺寸/规格\", \"壁厚/厚度\", \"表面\", \"偏差\", \"%\", \"℃/摄氏度\", \"强度\"\
          , \"离地\", \"漆\", \"供应商短名单\", \"见证项目表/见证提前通知时间\", \"长/长度\", \"容积\", \"度/°\"\
          , \"宽/宽度\"],\n    \"材质类\": [\"304\", \"316\", \"不锈钢\", \"2205\", \"NM\"\
          , \"耐磨\", \"料\", \"铸钢\", \"ND\"],\n    \"工艺类\": [\"衬\", \"喷\", \"涂\", \"\
          附\", \"镀\", \"球节\"],\n    \"供货类\": [\"进口\", \"封闭\", \"保温\", \"换热\", \"一备一用\"\
          , \"标牌/铭牌\"],\n    \"材料类\": [\"证明\", \"单据\", \"报关单\", \"说明书\", \"报告\", \"\
          手册\", \"合格证\", \"文件\", \"资料\", \"其他\"],\n}\nMAX_EXCERPTS = 8\n\n\ndef main(results:\
          \ list) -> dict:\n    # 合并迭代节点里每个文本块的提取结果，按关键字去重聚合\n    merged = {}\n  \
          \  for r in results or []:\n        text = (r or \"\").strip()\n       \
          \ if not text:\n            continue\n        s = text.find(\"[\")\n   \
          \     e = text.rfind(\"]\")\n        if s == -1 or e <= s:\n           \
          \ continue\n        try:\n            parsed = json.loads(text[s:e + 1])\n\
          \        except Exception:\n            continue\n        if isinstance(parsed,\
          \ dict):\n            for v in parsed.values():\n                if isinstance(v,\
          \ list):\n                    parsed = v\n                    break\n  \
          \      if not isinstance(parsed, list):\n            continue\n        for\
          \ it in parsed:\n            if not isinstance(it, dict):\n            \
          \    continue\n            cat = str(it.get(\"类别\", \"\")).strip()\n   \
          \         kw = str(it.get(\"关键字\", \"\")).strip()\n            if (cat,\
          \ kw) not in merged:\n                merged[(cat, kw)] = []\n         \
          \   for x in it.get(\"摘录\") or []:\n                x = str(x).strip()\n\
          \                if x and x not in merged[(cat, kw)]:\n                \
          \    merged[(cat, kw)].append(x)\n\n    lines = [\"| 类别 | 关键字 | 提取内容（原文摘录）\
          \ |\", \"| --- | --- | --- |\"]\n    count = 0\n    for cat, kws in KEYWORDS.items():\n\
          \        for kw in kws:\n            excerpts = merged.get((cat, kw), [])[:MAX_EXCERPTS]\n\
          \            if not excerpts:\n                lines.append(f\"| {cat} |\
          \ {kw} | （未找到） |\")\n                continue\n            for i, x in enumerate(excerpts):\n\
          \                x = x.replace(\"|\", \"\\\\|\").replace(\"\\n\", \"<br>\"\
          )\n                lines.append(f\"| {cat if i == 0 else ''} | {kw if i\
          \ == 0 else ''} | {x} |\")\n                count += 1\n\n    summary =\
          \ (\n        f\"本次共处理 {len(results or [])} 个文本块，\"\n        f\"共提取 {count}\
          \ 条摘录（每个关键字最多保留 {MAX_EXCERPTS} 条）。\"\n        f\"表格可直接复制到Excel（已解密_关键字摘取.xlsx\
          \ 的 类别/关键字/1..n 列）。\"\n    )\n    return {\"table\": summary + \"\\n\\n\"\
          \ + \"\\n\".join(lines)}\n"
        code_language: python3
        outputs:
          table:
            children: null
            type: string
        selected: false
