    - data:
        code: "import json\nimport time\nimport requests\n\nJOB_URL = \"https://paddleocr.aistudio-app.com/api/v2/ocr/jobs\"\
          \nTOKEN = \"db9d15b95e94de92dd1b1e1c6ebdf711f4f612e7\"\nMODEL = \"PaddleOCR-VL-1.6\"\
          \n\nCHUNK_MAX_CHARS = 60000\n\n\ndef main(pdf_file) -> dict:\n    # Dify\
          \ 传给代码节点的文件变量是数组，即使开始节点只允许上传1个\n    if isinstance(pdf_file, list):\n   \
          \     if not pdf_file:\n            raise ValueError(\"未收到上传的文件，请重新上传\"\
          )\n        pdf_file = pdf_file[0]\n    if not isinstance(pdf_file, dict):\n\
          \        raise ValueError(f\"文件变量格式异常: {type(pdf_file)}\")\n    file_url\
          \ = pdf_file.get(\"url\")\n    filename = pdf_file.get(\"filename\") or\
          \ \"upload.pdf\"\n    if not file_url:\n        raise ValueError(f\"未能获取文件的下载地址，文件属性:\
          \ {list(pdf_file.keys())}\")\n\n    headers = {\"Authorization\": f\"bearer\
          \ {TOKEN}\"}\n\n    # 1. 下载用户上传的 PDF（走 Dify 签名地址，保证本地部署也能用）\n    dl = requests.get(file_url,\
          \ timeout=120)\n    dl.raise_for_status()\n\n    # 2. 提交 OCR 任务（本地文件模式，multipart\
          \ 上传）\n    data = {\n        \"model\": MODEL,\n        \"optionalPayload\"\
          : json.dumps({\n            \"useDocOrientationClassify\": False,\n    \
          \        \"useDocUnwarping\": False,\n            \"useChartRecognition\"\
          : False,\n        }),\n    }\n    files = {\"file\": (filename, dl.content,\
          \ \"application/pdf\")}\n    job_response = requests.post(JOB_URL, headers=headers,\
          \ data=data, files=files, timeout=120)\n    if job_response.status_code\
          \ != 200:\n        raise ValueError(f\"OCR任务提交失败: {job_response.status_code}\
          \ {job_response.text[:300]}\")\n    job_id = job_response.json()[\"data\"\
          ][\"jobId\"]\n\n    # 3. 轮询任务状态\n    jsonl_url = \"\"\n    waited = 0\n\
          \    while True:\n        r = requests.get(f\"{JOB_URL}/{job_id}\", headers=headers,\
          \ timeout=60)\n        if r.status_code != 200:\n            raise ValueError(f\"\
          查询任务状态失败: {r.status_code} {r.text[:300]}\")\n        state = r.json()[\"\
          data\"][\"state\"]\n        if state == \"done\":\n            jsonl_url\
          \ = r.json()[\"data\"][\"resultUrl\"][\"jsonUrl\"]\n            break\n\
          \        if state == \"failed\":\n            error_msg = r.json()[\"data\"\
          ].get(\"errorMsg\", \"未知错误\")\n            raise ValueError(f\"OCR任务失败:\
          \ {error_msg}\")\n        if waited >= 780:\n            raise ValueError(f\"\
          OCR任务超时未完成（jobId: {job_id}），请稍后重试\")\n        time.sleep(5)\n        waited\
          \ += 5\n\n    # 4. 下载 JSONL 结果，按页收集 Markdown；图片路径替换为远程URL\n    jr = requests.get(jsonl_url,\
          \ timeout=120)\n    jr.raise_for_status()\n    markdown_parts = []\n   \
          \ for line in jr.text.strip().split(\"\\n\"):\n        line = line.strip()\n\
          \        if not line:\n            continue\n        result = json.loads(line)[\"\
          result\"]\n        for res in result[\"layoutParsingResults\"]:\n      \
          \      md_text = res[\"markdown\"][\"text\"]\n            for img_path,\
          \ img_url in res[\"markdown\"].get(\"images\", {}).items():\n          \
          \      md_text = md_text.replace(img_path, img_url)\n            markdown_parts.append(md_text)\n\
          \n    if not markdown_parts:\n        raise ValueError(\"OCR结果为空，请检查PDF内容\"\
          )\n\n    # 5. 按页边界切块，每块不超过 CHUNK_MAX_CHARS，\n    #    避免超出代码节点400000字符输出上限和模型上下文限制\n\
          \    chunks = []\n    cur = []\n    cur_len = 0\n    for part in markdown_parts:\n\
          \        if cur and cur_len + len(part) > CHUNK_MAX_CHARS:\n           \
          \ chunks.append(\"\\n\\n\".join(cur))\n            cur = []\n          \
          \  cur_len = 0\n        cur.append(part)\n        cur_len += len(part)\n\
          \    if cur:\n        chunks.append(\"\\n\\n\".join(cur))\n\n    return\
          \ {\"chunks\": chunks, \"chunk_count\": len(chunks)}\n"
        code_language: python3
        outputs:
          chunk_count:
            children: null
            type: number
          chunks:
            children: null
            type: array[string]
