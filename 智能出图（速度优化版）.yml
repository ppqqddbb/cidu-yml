          \        applied_param = _apply_param_assignments(saved_param or edit_table,\
          \ assignment_updates)\n        if applied_param:\n            saved_param\
          \ = applied_param\n            edit_table = applied_param\n            edit_kind\
          \ = \"param_direct\"\n        query = _normalize_assignment_command(original_query,\
          \ assignment_updates)\n    elif generic_last_updates:\n        query = _normalize_result_assignment_command(original_query,\
          \ generic_last_updates)\n    if calc_result_updates:\n        saved_last\
          \ = _apply_calc_result_updates(saved_last, calc_result_updates)\n      \
          \  saved_param = _sync_calc_updates_to_param(saved_param, calc_result_updates)\n\
          \        edit_table = saved_last\n        edit_kind = \"last\"\n    if explicit_calculation:\n\
          \        query = \"开始计算\"\n\n    supplement_query = _build_supplement_query(query,\
