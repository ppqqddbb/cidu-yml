    - data:
        code: "import re\n\n\ndef _clean(value):\n    return str(value or \"\").strip()\n\
          \n\ndef _compact(value):\n    return re.sub(r\"\\s+\", \"\", _clean(value)).lower()\n\
          \n\ndef _contains_any(text, words):\n    compact = _compact(text)\n    return\
          \ any(str(word).lower() in compact for word in words)\n\n\ndef _looks_like_selection_choice(value:\
          \ str) -> bool:\n    compact = _compact(value)\n    if not compact:\n  \
          \      return False\n    single = r\"(?:选|选择|确认|确定|就用|采用|使用)?第?[0-9一二两三四五六七八九十]+(?:个|项|号|款|模型)?\"\
          \n    if re.fullmatch(single, compact):\n        return True\n    body =\
          \ re.sub(r\"^(?:选|选择|确认|确定|就用|采用|使用|同时|一起|都|全部|帮我|请|我要|我选|我选择)\", \"\",\
          \ compact)\n    body = re.sub(r\"(?:都要|都生成|都输出|一起生成|一起输出|全部生成|全部输出|这几个|这些|候选|模型)$\"\
          , \"\", body)\n    multi = r\"(?:第?[0-9一二两三四五六七八九十]+(?:个|项|号|款|模型)?)(?:(?:和|与|及|、|,|，|;|；|\\\
          +|以及)(?:第?[0-9一二两三四五六七八九十]+(?:个|项|号|款|模型)?))+\"\n    return bool(re.fullmatch(multi,\
          \ body))\n\n\ndef _is_calculation_result_markdown(markdown: str) -> bool:\n\
          \    text = _clean(markdown)\n    if not text:\n        return False\n \
          \   return \"## 设备选型结果\" in text or (\n        \"参数值\" in text and \"后续应用\"\
          \ in text and \"|\" in text\n    )\n\n\ndef _equipment_selection_labels(last_markdown:\
          \ str):\n    labels = []\n    in_section = False\n    for line in str(last_markdown\
          \ or \"\").splitlines():\n        if \"## 设备选型结果\" in line:\n          \
          \  in_section = True\n            continue\n        if in_section and line.strip().startswith(\"\
          ## \"):\n            break\n        if not in_section or \"|\" not in line\
          \ or \"---\" in line:\n            continue\n        cells = [cell.strip()\
          \ for cell in line.strip().strip(\"|\").split(\"|\")]\n        if len(cells)\
          \ >= 2 and cells[0] not in (\"参数\", \"序号\", \"设备名称\"):\n            labels.append(cells[0])\n\
          \    return labels\n\n\ndef _looks_like_calculation_result_edit(query: str,\
          \ last_markdown: str) -> bool:\n    text = _clean(query)\n    last = _clean(last_markdown)\n\
          \    if not text or not last or not _is_calculation_result_markdown(last):\n\
          \        return False\n    labels = _equipment_selection_labels(last)\n\
          \    if any(label in text for label in sorted(labels, key=len, reverse=True)):\n\
          \        return True\n    return _contains_any(text, (\"修改\", \"改成\", \"\
          改为\", \"调整为\", \"更新为\", \"替换为\"))\n\n\ndef _looks_like_model_search(query:\
          \ str) -> bool:\n    text = _clean(query)\n    compact = _compact(query)\n\
          \    if not text:\n        return False\n    normal_flow_words = (\n   \
          \     \"选型计算\", \"参数提取\", \"提取参数\", \"参数补充\", \"补充参数\", \"开始计算\",\n    \
          \    \"公式计算\", \"查询外购件\", \"参数修改\", \"修改参数\", \"锅炉容量\", \"boiler_capacity\"\
          ,\n    )\n    if _contains_any(text, normal_flow_words):\n        return\
          \ False\n    if re.fullmatch(r\"(?:使用|试用|采用|套用|按|用)?默认(?:参数|值)?\", compact):\n\
          \        return True\n    if _contains_any(text, (\"生成模型\", \"插入模型\", \"\
          放入模型\", \"选中模型\", \"打开参数页\")):\n        return True\n    design_words =\
          \ (\n        \"设计\", \"生成\", \"创建\", \"新建\", \"建模\", \"模型\", \"参数化\",\n\
          \        \"斜梯\", \"斜体\", \"楼梯\", \"梯子\", \"平台\", \"护栏\", \"栏杆\", \"扶栏\"\
          ,\n        \"烟道\", \"天圆地方\", \"翅片\", \"翅片管\", \"盒子\", \"方块\", \"长方体\", \"\
          箱体\",\n        \"渣仓\", \"干渣\", \"捞渣机\",\n    )\n    if _contains_any(text,\
          \ design_words):\n        return True\n    if \"模型\" in compact and _contains_any(\n\
          \        text, (\"设计\", \"生成\", \"创建\", \"新建\", \"建模\", \"需要\", \"帮我\",\
          \ \"做一个\")\n    ):\n        return True\n    return False\n\n\ndef _looks_like_param_assignment(query:\
          \ str) -> bool:\n    text = _clean(query)\n    if not text:\n        return\
          \ False\n    if re.search(r\"[A-Za-z_][A-Za-z0-9_]*（[^）\\n]*）\\s*=\", text):\n\
          \        return True\n    if re.search(r\"(?m)^[A-Za-z_][A-Za-z0-9_]*[\\\
          t\\s]+[\\u4e00-\\u9fff]\", text):\n        return True\n    if re.search(r\"\
          (?m)^\\|?\\s*[A-Za-z_][A-Za-z0-9_]*\\s+[\\u4e00-\\u9fff]\", text):\n   \
          \     return True\n    keys = re.findall(r\"([A-Za-z_][A-Za-z0-9_]*)\\s*(?:（[^）\\\
          n]*）)?\\s*=\", text)\n    if keys and all(re.match(r\"^[A-Za-z_][A-Za-z0-9_]*$\"\
          , k) for k in keys):\n        return True\n    return False\n\n\ndef main(query:\
          \ str = \"\", last_markdown: str = \"\", param_markdown: str = \"\", recognized_text:\
          \ str = \"\") -> dict:\n    q = _clean(query)\n    if _looks_like_param_assignment(q):\n\
          \        route = \"selection_calc\"\n        reason = \"参数手动修改/赋值\"\n  \
          \  elif _looks_like_calculation_result_edit(q, last_markdown):\n       \
          \ route = \"selection_calc\"\n        reason = \"修改计算结果参数\"\n    elif _looks_like_selection_choice(_compact(q)):\n\
          \        route = \"model_selection\"\n        reason = \"用户回复候选编号，直接确认模型，不再重复混合检索\"\
          \n    elif _looks_like_model_search(q):\n        route = \"model_search\"\
          \n        reason = \"模型设计检索流程\"\n    else:\n        route = \"selection_calc\"\
          \n        reason = \"技术协议识别/选型计算流程\"\n    return {\n        \"route\": route,\n\
          \        \"reason\": reason,\n        \"query\": q,\n    }\n"
