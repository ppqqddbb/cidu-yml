          ):\n            in_selection_section = True\n            continue\n    \
          \    if in_selection_section and stripped.startswith(\"## \"):\n       \
          \     in_selection_section = False\n        if not in_selection_section:\n\
          \            continue\n        key = _selection_row_key(line)\n        if\
          \ key:\n            last_index_by_key[key] = index\n\n    output = []\n\
          \    in_selection_section = False\n    for index, line in enumerate(lines):\n\
          \        stripped = line.strip()\n        if stripped.startswith(\"## 设备选型结果\"\
          ):\n            in_selection_section = True\n            output.append(line)\n\
          \            continue\n        if in_selection_section and stripped.startswith(\"\
          ## \"):\n            in_selection_section = False\n        if in_selection_section:\n\
          \            key = _selection_row_key(line)\n            if key and last_index_by_key.get(key)\
          \ != index:\n                continue\n        output.append(line)\n   \
          \ return \"\\n\".join(output).strip()\n\ndef main(recognition_text: str\
          \ = \"\", gate_text: str = \"\", markdown_text: str = \"\", route: str =\
          \ \"\", source_kind: str = \"\", param_markdown: str = \"\", extracted_param_markdown:\
          \ str = \"\") -> dict:\n    recognition = _strip(recognition_text)\n   \
          \ gate = _strip(gate_text)\n    markdown = _strip(markdown_text)\n    extracted\
          \ = _strip(extracted_param_markdown)\n    kind = _strip(source_kind)\n \
          \   route_val = _strip(route)\n    effective_kind = kind or route_val\n\n\
          \    if _is_calculation_result_markdown(markdown):\n        markdown = _hide_calculation_process_section(markdown)\n\
          \        markdown = _hide_inactive_selection_rows(markdown)\n        markdown\
          \ = _deduplicate_selection_rows(markdown)\n\n    if route_val == \"message\"\
          \ and gate and _is_param_table_markdown(gate):\n        return {\"response_text\"\
          : _build_response(_repair_param_table_markdown(gate), effective_kind, route_val,\
          \ recognition)}\n\n    param_table = _pick_param_table(param_markdown, extracted,\
          \ markdown, gate)\n\n    if effective_kind == \"calculate\" and markdown:\n\
          \        hint = _next_step(\"calculate\", route_val, bool(param_table),\
          \ bool(markdown), recognition)\n        body = markdown\n        if hint\
