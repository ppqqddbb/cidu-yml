          \ route, is_param_table, bool(text), recognition)\n    if hint and hint\
          \ not in text:\n        text = text + \"\\n\\n---\\n\\n\" + hint\n    return\
          \ text\n\n\n\nHIDDEN_SELECTION_ROW_MARKERS = (\n    \"本次不参与应用计算\",\n   \
          \ \"辅助计算参数\",\n)\n\n\n\ndef _hide_inactive_selection_rows(markdown: str)\
          \ -> str:\n    \"\"\"隐藏不需要展示的设备结果行，不改变计算过程或内部保存结果。\"\"\"\n    text = _strip(markdown)\n\
          \    if not text or \"## 设备选型结果\" not in text:\n        return text\n  \
          \  if not any(marker in text for marker in HIDDEN_SELECTION_ROW_MARKERS):\n\
          \        return text\n    lines = []\n    in_selection_section = False\n\
          \    for line in text.splitlines():\n        stripped = line.strip()\n \
          \       if stripped.startswith(\"## 设备选型结果\"):\n            in_selection_section\
          \ = True\n            lines.append(line)\n            continue\n       \
          \ if in_selection_section and stripped.startswith(\"## \"):\n          \
          \  in_selection_section = False\n        if in_selection_section and \"\
