          ], \"value\": item[\"value\"]} for item in promoted]\n    raw_intent = _extract_json(intent_text)\n\
          \    intent = _normalize_intent(raw_intent, query)\n    intent = _force_explicit_intent(intent,\
          \ query, assignment_updates, generic_last_updates)\n    # 同一请求可同时携带“开始计算”和表格编辑值。编辑值先写入参数/覆盖项，\n\
