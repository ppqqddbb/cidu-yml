          \ route_val, recognition)}\n\n    if param_table:\n        return {\"response_text\"\
          : _build_response(param_table, effective_kind, route_val, recognition)}\n\
          \n    base = gate or markdown or recognition\n    return {\"response_text\"\
          : _build_response(base, effective_kind, route_val, recognition)}\n\n"
