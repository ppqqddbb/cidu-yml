        code: "import json\nimport re\n\nMAX_CHARS = 22000\nOVERLAP = 2500\nMAX_CHUNKS\
          \ = 14\nMAX_RECOGNIZED_TEXT_BYTES = 180000\nHEAD_CHARS = 18000\nTAIL_CHARS\
          \ = 12000\nCONTEXT_LINES = 10\nNL = chr(10)\nBLANK = NL + NL\nPARAM_KEYWORDS\
          \ = (\n    \"锅炉\", \"机组\", \"容量\", \"排渣\", \"排 渣\", \"出渣\", \"出 渣\", \"\
          渣量\", \"渣 量\", \"BMCR\", \"MCR\", \"煤种\",\n    \"干渣\", \"干 渣\", \"炉渣\",\
          \ \"底渣\", \"堆积密度\", \"堆 积 密 度\", \"密度\", \"安息角\",\n    \"渣井\", \"渣 井\",\
          \ \"储渣\", \"存渣\", \"储存时间\", \"排渣口\", \"落渣口\",\n    \"下联箱\", \"下 联 箱\", \"\
          梳形板\", \"梳 形 板\", \"膨胀\", \"热位移\", \"标高\",\n    \"渣仓\", \"渣 仓\", \"贮渣仓\"\
