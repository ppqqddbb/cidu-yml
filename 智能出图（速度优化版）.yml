          连接\", \"链接\", \"落料管\",\n    \"碎渣机\", \"干式排渣机\", \"一级上仓\", \"性能数据\", \"技术参数\"\
          , \"设计参数\", \"接口条件\", \"设备规范\",\n    \"t/h\", \"t／h\", \"t / h\", \"吨/小时\"\
          , \"吨／小时\", \"MW\", \"M W\", \"mm\", \"m m\", \"毫米\", \"m3\", \"m³\", \"\
          m 3\", \"立方米\", \"小时\", \"h\", \"°\"\n)\nTEXT_KEYS = {\n    \"markdown_content\"\
          , \"markdown\", \"text\", \"content\", \"result\", \"output\", \"value\"\
          ,\n    \"words\", \"word\", \"sentence\", \"line\", \"paragraph\", \"rec_text\"\
          , \"recognized_text\",\n    \"ocr_text\", \"plain_text\", \"transcription\"\
          \n}\nCONTAINER_KEYS = {\n    \"data\", \"pages\", \"page\", \"blocks\",\
          \ \"block\", \"lines\", \"line\", \"spans\", \"span\",\n    \"paragraphs\"\
          , \"items\", \"results\", \"ocr_result\", \"ocr_results\", \"layout\", \"\
          tables\", \"cells\", \"cell\"\n}\n\n\ndef _utf8_size(text):\n    return\
          \ len(str(text or \"\").encode(\"utf-8\"))\n\n\ndef _trim_to_byte_limit(text,\
          \ max_bytes):\n    text = str(text or \"\")\n    if _utf8_size(text) <=\
          \ max_bytes:\n        return text\n    marker = BLANK + \"【系统截断提示：识别文本仍然过长，已按变量大小限制截断。】\"\
          \n    target_bytes = max(1024, max_bytes - _utf8_size(marker))\n    low\
          \ = 0\n    high = len(text)\n    while low < high:\n        mid = (low +\
          \ high + 1) // 2\n        if _utf8_size(text[:mid]) <= target_bytes:\n \
          \           low = mid\n        else:\n            high = mid - 1\n    return\
          \ text[:low].rstrip() + marker\n\n\ndef _looks_like_noise(text):\n    raw\
          \ = str(text or \"\").strip()\n    if not raw:\n        return True\n  \
          \  low = raw.lower()\n    if low in {\"null\", \"none\", \"true\", \"false\"\
          , \"success\", \"ok\"}:\n        return True\n    if re.fullmatch(r\"[\\\
          d.\\-_: /\\\\]+\", raw) and len(raw) < 8:\n        return True\n    return\
          \ False\n\n\ndef _flatten_ocr(value, depth=0):\n    if depth > 12 or value\
          \ is None:\n        return []\n    if isinstance(value, str):\n        text\
          \ = value.strip()\n        if not text:\n            return []\n       \
          \ if (text.startswith(\"{\") and text.endswith(\"}\")) or (text.startswith(\"\
          [\") and text.endswith(\"]\")):\n            try:\n                return\
          \ _flatten_ocr(json.loads(text), depth + 1)\n            except Exception:\n\
          \                pass\n        return [] if _looks_like_noise(text) else\
          \ [text]\n    if isinstance(value, (int, float)):\n        return []\n \
          \   if isinstance(value, list):\n        parts = []\n        for item in\
          \ value:\n            parts.extend(_flatten_ocr(item, depth + 1))\n    \
          \    return parts\n    if isinstance(value, dict):\n        parts = []\n\
          \        # Prefer explicit OCR/text fields first.\n        for key, item\
          \ in value.items():\n            if str(key).lower() in TEXT_KEYS:\n   \
          \             parts.extend(_flatten_ocr(item, depth + 1))\n        # Then\
          \ recurse through known containers.\n        for key, item in value.items():\n\
          \            key_l = str(key).lower()\n            if key_l in TEXT_KEYS:\n\
          \                continue\n            if key_l in CONTAINER_KEYS or isinstance(item,\
          \ (dict, list)):\n                parts.extend(_flatten_ocr(item, depth\
          \ + 1))\n        return parts\n    return []\n\n\ndef _pick_text(raw):\n\
          \    text = str(raw or \"\").strip()\n    if not text:\n        return \"\
          \"\n    try:\n        data = json.loads(text)\n    except Exception:\n \
          \       return _clean_ocr_text(text)\n    parts = _flatten_ocr(data)\n \
          \   if parts:\n        return _clean_ocr_text(NL.join(parts))\n    if isinstance(data,\
          \ dict):\n        for key in (\"markdown_content\", \"markdown\", \"text\"\
          , \"content\", \"result\", \"output\"):\n            value = data.get(key)\n\
          \            if isinstance(value, str) and value.strip():\n            \
          \    return _clean_ocr_text(value)\n    return _clean_ocr_text(text)\n\n\
          \ndef _clean_ocr_text(text):\n    text = str(text or \"\")\n    text = text.replace(\"\
          \\r\\n\", NL).replace(\"\\r\", NL)\n    text = text.replace(\"｜\", \"|\"\
          ).replace(\"／\", \"/\").replace(\"ｍ\", \"m\").replace(\"Ｍ\", \"M\").replace(\"\
          Ｗ\", \"W\")\n    text = text.replace(\"㎥\", \"m³\").replace(\"m 3\", \"\
          m3\").replace(\"M W\", \"MW\").replace(\"m m\", \"mm\")\n    text = re.sub(r\"\
          (?<=[一-鿿])\\s+(?=[一-鿿])\", \"\", text)\n    text = re.sub(r\"([排出储存卸干湿锅炉渣仓井下联箱梳形板堆积密度容积直径角度中心线标高])\\\
          s+\", r\"\\1\", text)\n    text = re.sub(r\"\\s+(t\\s*/\\s*h|MW|mm|m3|m³|h|°)\"\
          , r\" \\1\", text, flags=re.I)\n    text = re.sub(r\"t\\s*/\\s*h\", \"t/h\"\
          , text, flags=re.I)\n    text = re.sub(r\"吨\\s*/\\s*小时\", \"吨/小时\", text)\n\
          \    text = re.sub(r\"(\\d)\\s+(?=\\.\\d)\", r\"\\1\", text)\n    text =\
          \ re.sub(r\"(?<=\\d)\\s+(?=\\d{1,3}(?:\\.\\d+)?\\s*(?:t/h|吨/小时|MW|mm|m3|m³|h|°))\"\
          , \" \", text)\n    lines = []\n    for line in text.splitlines():\n   \
          \     line = re.sub(r\"[ \\t]+\", \" \", line).strip()\n        if not line:\n\
          \            if lines and lines[-1] != \"\":\n                lines.append(\"\
          \")\n            continue\n        lines.append(line)\n    return NL.join(lines).strip()\n\
          \n\ndef _line_score(line):\n    raw = str(line or \"\")\n    compact = raw.lower()\n\
          \    score = 0\n    for keyword in PARAM_KEYWORDS:\n        if str(keyword).lower()\
          \ in compact:\n            score += 3\n    if \"|\" in compact or \"\\t\"\
          \ in raw or re.search(r\"\\S\\s{2,}\\S\", raw):\n        score += 2\n  \
          \  if any(unit in compact for unit in (\"t/h\", \"吨/小时\", \"mw\", \"mm\"\
          , \"m3\", \"m³\", \"°\")):\n        score += 2\n    if re.search(r\"(?:^|[^0-9])(?:第\\\
          s*)?\\d+(?:\\.\\d+){1,4}(?:\\s*[章节条款、.．)]|\\s+|$)\", raw):\n        score\
          \ += 2\n    if re.search(r\"(技术规范|技术协议|设计条件|运行条件|性能保证|技术参数|设备规范|接口条件|供货范围|主要参数|表\\\
          s*\\d+)\", raw):\n        score += 3\n    return score\n\n\ndef _focused_text(text):\n\
          \    text = str(text or \"\").strip()\n    if len(text) <= MAX_CHARS * MAX_CHUNKS:\n\
          \        return text\n    lines = text.splitlines()\n    selected = set()\n\
          \    for idx, line in enumerate(lines):\n        if _line_score(line) <=\
          \ 0:\n            continue\n        start = max(0, idx - CONTEXT_LINES)\n\
          \        end = min(len(lines), idx + CONTEXT_LINES + 1)\n        selected.update(range(start,\
          \ end))\n    focused_lines = []\n    last_idx = None\n    for idx in sorted(selected):\n\
          \        if last_idx is not None and idx > last_idx + 1:\n            focused_lines.append(BLANK\
          \ + \"【中间省略：非参数相关段落】\")\n        focused_lines.append(f\"[原文行{idx + 1}]\
          \ {lines[idx]}\")\n        last_idx = idx\n    parts = [\n        \"【原文开头保留】\"\
          \ + NL + text[:HEAD_CHARS],\n        \"【参数关键词相关片段】\" + NL + NL.join(focused_lines)\
          \ if focused_lines else \"\",\n        \"【原文结尾保留】\" + NL + text[-TAIL_CHARS:]\n\
          \    ]\n    return BLANK.join([part for part in parts if part]).strip()\n\
          \n\ndef _split_chunks(text):\n    text = _focused_text(text)\n    chunks\
          \ = []\n    start = 0\n    while start < len(text) and len(chunks) < MAX_CHUNKS:\n\
          \        end = min(start + MAX_CHARS, len(text))\n        if end < len(text):\n\
          \            cut = text.rfind(NL, start + MAX_CHARS // 2, end)\n       \
          \     if cut > start:\n                end = cut\n        chunk = text[start:end].strip()\n\
          \        if chunk:\n            chunks.append(chunk)\n        if end >=\
          \ len(text):\n            break\n        next_start = max(0, end - OVERLAP)\n\
          \        if next_start <= start:\n            next_start = end\n       \
          \ start = next_start\n    return chunks\n\n\ndef main(ocr_text: str = \"\
          \", doc_text: str = \"\") -> dict:\n    ocr_value = _pick_text(ocr_text)\n\
          \    doc_value = _pick_text(doc_text)\n    raw_text = ocr_value or doc_value\n\
          \    source = \"ocr\" if ocr_value else (\"doc\" if doc_value else \"none\"\
          )\n    chunks = _split_chunks(raw_text)\n    compact_text = _trim_to_byte_limit(BLANK.join(chunks),\
          \ MAX_RECOGNIZED_TEXT_BYTES)\n    if source == \"ocr\" and compact_text:\n\
          \        compact_text = \"【PDF OCR识别文本：可能存在空格断字、表格错列、页眉页脚干扰。抽取时需按相邻行/相邻字段合并判断。】\"\
          \ + BLANK + compact_text\n    return {\n        \"recognized_text\": compact_text,\n\
          \        \"recognized_source\": source,\n        \"chunk_count\": str(len(chunks)),\n\
          \        \"chunks\": chunks,\n    }\n"
