          , \"角度\",\n    \"卸料\", \"卸 料\", \"干式卸料\", \"湿式卸料\", \"双轴搅拌机\", \"汽车散装机\"\
          , \"散装机\", \"出力\",\n    \"转运层\", \"运转层\", \"关断门\", \"液压关断门\", \"定位距离\",\
