          「参数补充」流程已取消。上传技术协议后系统会自动从知识库补全缺失参数；手动更新请使用「参数修改」并按 key=值 填写。\"\n       \
          \ intent[\"route\"] = \"message\"\n        if saved_param:\n           \
          \ return _payload(\"message\", saved_param + \"\\n\\n\" + hint, text, query,\
