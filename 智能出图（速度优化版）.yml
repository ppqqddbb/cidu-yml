            \n注意：用户清单中\"干渣仓卸料形式\"出现两次。必须依靠参数标识区分：unloading_type只存单口/双口结构，unloading_form只存干式/湿式/事故排渣工艺，严禁互相复制参数值。\n\
            \n# 参数匹配规则\n1. 参数名称可以与目标名称不完全一致；只要含义、单位、上下文与目标参数一致，就映射到最相关的参数标识。\n2. 需要识别同义、近义、倒装、拆分表达，例如\"\
            锅炉中心线至渣仓中心线间距\"也可能写成\"渣仓中心线距锅炉中心线距离\"。\n3. 表格跨行时，必须综合表名、章节标题、上一行参数名、本行单位、相邻数值、列名（设计煤种/校核煤种/单位/备注）判断。\n\
            4. 标题或章节名中出现参数对象，表格行中只有\"单位+数值\"时，要把标题/章节上下文并入判断。\n5. 有明确限定词\"约、暂定、不小于、不得小于、应不小于、≥、不大于、≤、按……考虑\"\
            且它是项目给出的明确值时，可以抽取，证据必须保留限定词。\n6. \"投标方填写/投标方提供/专题说明/由招标方确认\"但没有明确值时，不得抽取。\n\
            7. 每个非 null 值必须有直接证据短句支撑；如果写不出能直接支撑该值的原文短句，必须填 null。\n8. **严禁把设备清单表格\"\
            数量\"列的值（如渣井2套）当作渣井口数**。\n\n# 多值、范围与最大值规则\n1. 数值型参数同一 key 出现多个候选时，先确认候选属于同一个参数含义、设备/系统边界和计量维度，再统一单位取最大值。\n\
            2. 多个煤种/工况必须取最大值。例如：设计煤种正常运行4.71、校核煤种正常运行7.67、校核煤种正常运行7.74，则 boiler_normal_slag_rate\
            \ 输出 7.74；最大排渣量 14.13、23.01、23.22，则 max_slag_rate 输出 23.22。\n3. 范围值取上限，例如\
            \ 40~80t/h 输出 80，0.8～1.0t/m³ 输出 1.0。\n4. 只能在同一个参数内比较，禁止跨参数比较：锅炉最大排渣量不能与干渣机出力、碎渣机出力、卸料出力比较；渣仓有效容积不能与渣井容积比较；锥段角度不能与渣井倾角比较。\n\
            5. 设备数量、机组台数、型号编号、章节编号、图号、序号、年份等数字不能参与最大值选择。\n6. 文本型参数不执行最大值规则。若同一文本参数出现多个互补子项（如干式卸料和湿式卸料均被原文明确列出），应都作为参数值；若互相矛盾且无法判定当前项目采用值，填\
            \ null。\n7. 卸料出力如果干式卸料设备和湿式卸料设备均有明确出力，应保留对应关系，例如\"干式卸料：100；湿式卸料：100\"\
            ，不要只保留一个而丢失另一项。\n\n# 文档实测防混淆规则（基于11份技术协议/规范/招标书标定）\n\n以下规则优先级高于一般同义词匹配；违反任一条即视为错误提取，必须填\
            \ null。\n\n## A. 锅炉侧参数 vs 设备出力（最高频错误）\n\n| 禁止映射 | 常见误提取来源 | 正确应填参数 |\n\
            | :--- | :--- | :--- |\n| boiler_normal_slag_rate / max_slag_rate | 干渣机正常/最大出力、碎渣机出力、卸料出力、系统设计出力\
            \ | 仅锅炉侧排渣量字段 |\n| unloading_rate | 锅炉排渣量、干渣机出力 | 散装机/搅拌机/卸料设备出力 |\n|\
            \ max_slag_rate | 干渣机最大45t/h、碎渣机30t/h | 原文\"锅炉最大排渣量/吹灰时最大排渣量\" |\n\n判定口诀：主语必须是\"\
            锅炉/设计煤种/校核煤种/BMCR/MCR/吹灰\"，而不是\"干渣机/碎渣机/散装机/搅拌机\"。\n\n## B. 排渣量专项（设计煤种/校核煤种/灰渣比例）\n\
            \n1. 先定位章节：如\"2.4.2排渣量\"\"1.4.4 BMCR工况下渣量\"\"3.1.4.7锅炉排渣运行工况\"。\n2. boiler_normal_slag_rate\
            \ 只取：\n   - 行名含\"正常运行/正常排渣量/运行连续排渣量/设计煤种排渣量（非吹灰节）\"\n   - 表格\"按10%/15%灰渣量计\"\
            的正常运行行\n   - \"正常运行X t/h/炉\"（聊城祥光校核7.74、淮北国安校核16.11、沈阳全胜校核7.25）\n3. max_slag_rate\
            \ 只取：\n   - \"锅炉最大排渣量\"\"吹灰时最大排渣量\"\"吹灰时排渣量\"\"吹灰时连续排渣量\"\n   - 定州：吹灰时26.43；淮北国安：42.96；沈阳全胜：35\n\
            4. 禁止把\"吹灰时\"数值填入正常排渣量；禁止把干渣机\"8~12t/h正常、45t/h最大\"填入锅炉排渣量。\n5. 多煤种、多灰渣比例、多校核煤种并列时，各参数分别取同类行中的最大值。\n\
            \n## C. 渣井参数专项（渣井口数/总容积/储渣时间/密度）\n\n### C.1 slag_well_max_storage_time（渣井最大储渣时间）\n\
            - 从\"渣井/过渡渣斗/渣斗\"句中抽取小时数：如\"满足BMCR工况8小时最大排渣量\"→8\n- 淮北国安8h、聊城祥光6h、定州8h、沈阳全胜8h、黄陵4h\n\
            - 禁止：渣仓贮存40/48小时渣量、设备故障停运6小时、轴承寿命8000小时\n\n### C.2 dry_slag_bulk_density（干渣堆积密度）\n\
            - 只认独立字段\"干渣堆积密度：约0.9t/m3\"\"干渣堆积密度：0.8~1.0t/m3\"→取0.9或1.0\n- 禁止：湿渣1.3、渣真实密度2.4、\"\
            计算渣库结构荷载时密度1.4\"\n- 若同时有\"干渣堆积密度\"和\"计算渣仓容积时密度0.9\"，优先前者；二者一致时可互相印证\n\n\
            ### C.3 slag_well_count（渣井口数）——高优先级，专门强化\n\n**⚠️ 核心定义：渣井口数指单个渣井设备底部向下排渣的出口数量（即每个渣井有几个排渣口），不是渣井设备的台数。**\n\
            \n**提取步骤（必须按顺序执行）：**\n\n第1步：搜索\"每套渣斗排渣口数量\"，找到后取数字值。\n\n第2步：搜索\"锅炉渣井排渣口数量\"\
            ，找到后取数字值。\n\n第3步：搜索\"排渣口数量\"或\"渣井口数\"或\"排渣口数\"，在\"渣井/渣斗\"相关段落/表格中取数字值。\n\
            \n第4步：搜索\"每套渣斗\"或\"渣斗数量\"或\"渣井数量\"，确认主语是\"渣井/渣斗\"后取数字值。\n\n第5步：搜索\"液压关断门门板数量\"\
            或\"关断门数量\"（每口渣井对应一组关断门），如果明确写有\"每套渣斗排渣口数量\"则提取。\n\n**常见误识别陷阱（必须避免）：**\n\
            | 误识别来源 | 问题 | 正确做法 |\n| :--- | :--- | :--- |\n| \"渣井 4 套\"（设备清单中渣井数量）\
            \ | 单位是\"套/个\"但指渣井设备数量，不是渣井口数 | 渣井口数是渣井内部排渣口数量，非渣井设备数量，判为失败，填 null |\n\
            | \"排渣口数量通常为2～5个\"（知识库描述性文字） | 这是范围描述，不是具体项目数值 | 判为失败，填 null |\n| \"渣仓卸料口数\"\
            \ | 这是渣仓底部的卸料口数量，不是渣井口数 | 判为失败，填 null |\n| 设备清单表格中\"数量\"列 | 表示设备台数 | 绝对不能提取，须在正文中找排渣口数量\
            \ |\n\n### C.4 jv（渣井总容积）——直接提取，禁止公式代算\n\n1. \"过渡渣斗\"和\"过度渣斗\"在本工作流中均指渣井；其总容积/有效容积必须映射到jv（渣井总容积）。\n\
            2. 只有原文直接出现容积数值时才能提取，例如\"过渡渣斗总有效容积116m³\"\"渣井总容积120m³\"\"渣井有效容积≥20m³\"\
            。\n3. 原文仅写\"满足8小时排渣量\"、仅给锅炉正常排渣量/储渣时间/堆积密度，或仅出现GZJ325型号时，jv必须填null；严禁自行相乘、反推或用型号额定容积补齐。\n\
            4. GZJ325中的25是单口有效容积，不是总容积；除非原文另有直接总容积字段，否则不得输出25或25×口数。\n5. 必须区分cv1干渣仓有效容积和jv渣井总容积：对象是干渣仓/贮渣仓时归cv1，对象是渣井/渣斗/过渡渣斗/过度渣斗时归jv。\n\
            \n## D. 锅炉接口尺寸与膨胀\n\n### D.1 comb_plate_length / comb_plate_width 提取强化规则：\n\
            \n| 场景 | 提取方法 |\n| :--- | :--- |\n| 有方向标注（宽度方向/深度方向/长度方向） | 宽度方向→length，深度方向→width\
            \ |\n| 仅有两维A×B无方向标注 | 第一维/较大值→length，第二维/较小值→width |\n| 表述为\"A×B\"且A>B\
            \ | A→length，B→width |\n| 标注为\"暂定\"但已有具体数值 | 仍然提取数值，证据中保留\"暂定\"限定词 |\n\
            | 标注为\"mm（暂定）\"但无具体数值 | 不提取，填null |\n| 出现\"×××（锅炉宽度方向）×××（锅炉深度方向）\" |\
            \ 宽度方向值→length，深度方向值→width |\n| 出现\"锅炉下部梳形密封板尺寸：×××mm×××mm\" | 第一维→length，第二维→width\
            \ |\n\n### D.2 boiler_down_expansion（锅炉下膨胀量）提取强化规则：\n\n| 场景 | 提取方法 |\n\
            | :--- | :--- |\n| 明确写\"锅炉下膨胀量：XXXmm\"或\"Z方向（向下）XXXmm\" | 直接提取数值 |\n|\
            \ 写\"向下膨胀XXXmm\"或\"垂直热位移XXXmm\" | 直接提取数值 |\n| 写\"Z方向向下XXXmm\" | 直接提取数值\
            \ |\n| 写\"膨胀量：X方向XXmm，Y方向XXmm，Z方向XXmm\" | 取Z方向数值 |\n| 仅写\"存在向下膨胀\"或\"\
            膨胀量见接口图\" | 不提取，填null，标注\"未给出具体数值\" |\n| 出现水平方向（X/Y方向）热位移值 | 不提取，此为非向下分量\
            \ |\n\n### D.3 t1（下联箱标高）提取强化规则：\n\n| 场景 | 提取方法 |\n| :--- | :--- |\n| 明确写\"\
            下联箱标高：7.00m\"或\"下联箱中心标高：EL7000\" | 提取，m换算为mm |\n| 接口图中标注\"EL数字\"或\"EL+数字\"\
            \ | 提取数字，如EL7000→7000mm |\n| 写\"锅炉下联箱中心线标高7.00m\"或\"标高EL7000\" | 提取 |\n\
            | 写\"7m层\"但未明确是下联箱标高 | 不自动提取，需确认上下文 |\n| 锅炉规范中有\"锅炉下联箱中心标高：数字m\" | 直接提取\
            \ |\n\n### D.4 bolt_height_diff（螺栓高度差）提取强化规则：\n\n| 场景 | 提取方法 |\n| :---\
            \ | :--- |\n| 明确写\"密封板连接螺栓高度差：XXXmm\" | 直接提取 |\n| 明确写\"连接螺栓高差XXXmm\"或\"\
            螺栓高度差XXXmm\" | 直接提取 |\n| 出现\"L密封板自身高度=下膨胀量-螺栓高度差+25\"时 | 如果下膨胀量和L密封板自身高度都有值，可反推螺栓高度差（仅当公式明确时）\
            \ |\n| 全文搜索无匹配且无法反推 | 填null，标注\"未找到明确依据\" |\n\n### D.5 comb_plate_length/width\
            \ 与 boiler_silo_center_distance 的区分\n\n| 参数 | 数值特征 | 禁止混淆 |\n| :--- |\
            \ :--- | :--- |\n| comb_plate_length | 通常在 3000~50000mm 范围 | 严禁取42000m、38000m等大尺度距离\
            \ |\n| boiler_silo_center_distance | 通常在 30~50m 范围（30000~50000mm） | 严禁取3000mm级别的尺寸\
            \ |\n\n### D.6 boiler_silo_center_distance（渣仓中心线至锅炉中心线间距）提取强化规则：\n\n|\
            \ 场景 | 提取方法 |\n| :--- | :--- |\n| 明确写\"渣仓中心线距锅炉中心线距离\" | 直接提取 |\n| 写\"\
            锅炉中心线至渣仓中心线横向垂直距离\" | 直接提取 |\n| 写\"渣仓中心线至锅炉中心线间距：XXm\" | 直接提取 |\n| 写\"\
            渣仓中心线与锅炉中心线距离约XXm\" | 提取，\"约\"保留在证据中 |\n| 写\"干渣机中心线与锅炉中心线的偏心距\"（400~500mm）\
            \ | 不提取，这是干渣机偏心距，不是渣仓间距 |\n\n1. comb_plate_length / comb_plate_width 映射铁律：\n\
            \   - 有方向标注：锅炉宽度方向/炉膛宽度方向映射comb_plate_length；锅炉深度方向/炉膛深度方向映射comb_plate_width。\n\
            \   - 仅有两维A×B且无方向标注：第一维/较大值映射length，第二维/较小值映射width。\n   - 除非原文明确为正方形，length与width不得相同；方向冲突时填null并注明待确认。\n\
            \   - \"见接口图/投标方填写\"且当前文本没有数值时填null。\n   - **标注\"暂定\"但有数值时仍然提取**，证据中保留\"\
            暂定\"字样。\n2. boiler_down_expansion只取明确的垂直向下膨胀分量，不得把水平分量填入。\n3. t1只取锅炉下联箱标高/中心标高，不得取密封板、转运层、渣仓或平台标高。\n\
            4. 任何历史项目、标定样例、提示词中的数值都只能帮助理解字段边界，绝不是当前项目值；当前项目值必须由本轮输入原文直接支持。\n\n## E.\
            \ 渣仓 vs 渣井（对象边界）\n\n| 参数 | 必须上下文 | 禁止混淆 |\n| :--- | :--- | :--- |\n| d1\
            \ / cv1 / cone_included_angle | 渣仓/干渣仓/贮渣仓 | 渣井有效容积、过渡渣斗容积 |\n| cv1 |\
            \ 渣仓有效容积/有效储渣容积 | 渣仓总容积、可贮存X小时渣量（时间不是容积） |\n| cone_included_angle | 渣仓下部锥体角度/锥斗夹角\
            \ | 渣井井壁夹角；约束\"不小于60°\"不得机械填60，允许值60/70均满足时按0716规则优选70 |\n\n渣仓直径：原文\"\
            直径8m/φ8m/按照8.0m考虑\"→8000mm。\n\n## F. 布置与连接\n\n1. boiler_silo_center_distance：只认锅炉中心线↔渣仓中心线\n\
            \   - 定州~42m→42000；淮北38m→38000；沈阳全胜33.8m→33800；黄陵不超过42.25m→42250；聊城祥光由设计院确认\n\
            \   - 禁止：\"渣仓中心线与锅炉外侧柱中心线距离20.4m\"（柱中心≠锅炉中心）\n   - **特别注意**：干渣机中心线与锅炉中心线的偏心距（如400~500mm）不属于此参数，严禁误提取\n\
            2. conveyor_silo_connection_type：提取系统流程原文\n   - 优选：\"风冷干式排渣机（一级）+碎渣机+渣仓+汽车外运系统\"\
            \n   - 或：\"一级直接进渣仓\"\"干渣机一步上仓\"\"碎渣机+落料管进渣仓\"\n   - 写明\"不采用三通\"时不得输出含三通\n\
            3. transfer_floor_height：运转层/转运层平台标高\n   - 定州\"渣仓5m为运转层\"→5000；聊城\"4.2m层为运转层\"\
            →4200；黄陵\"卸料设备运转层标高5m\"→5000\n   - 禁止：湿式卸料管离地标高4.3m/4.5m\n\n## G. 卸料三类参数（极易混淆）\n\
            \n1. unloading_type = 渣仓底部出渣口结构（几口）\n   - 双出口/裤衩/2个排出口/两个出渣口 → 双口\n  \
            \ - 单出口 → 单口\n   - 不是干式/湿式之分！\n2. unloading_form = 干湿卸料配置（重要：必须完整识别）\n\
            \   - 必须扫描全文中所有卸料设备类型，只要出现\"干式卸料机/干灰散装机/干式卸料\"相关描述，就计入干式\n   - 只要出现\"\
            湿式卸料/双轴搅拌机/湿式搅拌机\"相关描述，就计入湿式\n   - 干湿均有 → 必须输出 \"干式卸料、湿式卸料\"（用顿号或逗号分隔，保留两种）\n\
            \   - 仅干式 → 输出 \"干式卸料\"\n   - 仅湿式 → 输出 \"湿式卸料\"\n   - 禁止只输出其中一种而遗漏另一种\n\
            \   - 禁止用\"、\"/\",\"以外的其他分隔符\n3. unloading_rate = 卸料设备出力\n   - 干式散装机100t/h、湿式搅拌机100t/h\
            \ → \"干式：100；湿式：100\"\n   - 禁止填入锅炉排渣量\n\n## H. 强证据绑定\n\n1. 非 null 值须在同句、同表格行或相邻≤2行内同时出现参数对象名与数值\n\
            2. \"不小于/约/暂定/≥\"可抽取，证据保留限定词\n3. \"投标方填写/见接口图/最终以施工图为准\"且无数字 → null\n\
            4. 选型计算输出表、模型写入示例值 → 不得填入\n\n## I. 示例隔离规则\n\n禁止从历史项目、训练样例、提示词示例、上一次会话或模型记忆复制任何参数值。每个文档提取的非null值都必须能在本轮允许的数据源中找到同对象、同字段的原文证据；无法写出证据短句时必须填null。推荐默认值只允许由循环参数结果合并节点按固定策略补充。\n\
            \n# 输出格式强制要求\n1. 只输出一个Markdown表格，禁止输出JSON、代码块、解释性文字、前后缀说明。\n2. 表格固定五列，列名必须为：参数标识、参数名称、参数值、单位、来源。参数标识和单位用于后续计算接口，参数名称、参数值、来源为用户要求的核心内容。\n\
            3. 参数标识必须使用上表标准key；禁止输出n，渣井口数只允许输出slag_well_count；渣井总容积只允许输出jv。\n4. 参数名称必须逐字等于目标表中的固定名称；不得使用旧名称、同义词、内部代号或在名称后追加单位。\n\
            5. 参数值列：数值型尽量只写数字；文本型保留关键文本；不得把单位写入参数值列；未取得值填null。\n6. 单位列：统一使用MW、t/h、mm、m³、°、h、口；文本型填-。\n\
            7. 来源列必须反映本行实际来源：文档直接值写\"技术协议｜章节号/表名｜原文短句\"；本节点未提取到时写\"技术协议｜未找到明确依据\"\
            。后续推荐默认值必须统一写成\"技术协议｜未找到明确依据，推荐默认值｜默认{实际值及单位}\"，禁止出现\"工作计划默认\"或\"主文档及补充文档均未明确\"\
            。不得把示例值伪装成文档值。\n8. 文档非null值优先级最高，知识库不得覆盖上传文档；默认值不得覆盖任何文档值。\n9. 输出顺序必须与目标参数表完全一致，固定25行，不多不少。\n\
            10. 来源列内禁止使用英文竖线|，统一使用全角分隔符｜，确保每行严格保持五列。\n11. 长度/宽度强校验：A×B中第一维/较大值映射comb_plate_length，第二维/较小值映射comb_plate_width；除非原文明确为正方形，两者不得取相同值。若length≤width且没有明确方向证据，length填null，来源注明\"\
            尺寸方向冲突，待确认\"。\n\n# 输出模板（只规定结构，不提供可照抄的项目值）\n| 参数标识 | 参数名称 | 参数值 | 单位 |\
            \ 来源 |\n| :--- | :--- | :--- | :--- | :--- |\n| boiler_normal_slag_rate\
            \ | 锅炉正常排渣量 | null | t/h | 技术协议｜未找到明确依据 |\n| dry_slag_bulk_density | 干渣堆积密度\
            \ | null | t/m³ | 技术协议｜未找到明确依据 |\n| slag_well_max_storage_time | 渣井最大储渣时间\
            \ | null | h | 技术协议｜未找到明确依据 |\n| slag_well_count | 渣井口数 | null | 口 | 技术协议｜未找到明确依据\
            \ |\n| jv | 渣井总容积 | null | m³ | 技术协议｜未找到明确依据 |\n| max_slag_rate | 锅炉最大排渣量\
