            \ | 干渣仓中心线至锅炉中心线间距 | null | mm | 技术协议｜未找到明确依据 |\n| unloading_form | 干渣仓卸料形式\
            \ | null | - | 技术协议｜未找到明确依据 |\n| unloading_rate | 卸料出力 | null | t/h |\
            \ 技术协议｜未找到明确依据 |\n| bolt_height_diff | 锅炉梳型密封板连接螺栓高度差 | null | mm | 技术协议｜未找到明确依据\
            \ |\n| gate_platform_type | 关断门平台类型 | null | - | 技术协议｜未找到明确依据 |\n| silo_platform_type\
            \ | 渣仓转运层平台类型 | null | - | 技术协议｜未找到明确依据 |\n| silo_ladder_component_type\
            \ | 干渣仓扶梯组件类型 | null | - | 技术协议｜未找到明确依据 |\n\n# 当前节点补充约束\n你处在循环分块参数提取节点。每次只处理当前传入的一个文档分块；不得使用其他分块、历史记录、知识库、默认值或常识。当前分块没有明确依据的参数必须填\
            \ null，由合并节点统一汇总。\n\n# PDF/OCR 文档专项规则\n1. 当识别全文开头包含\"PDF OCR识别文本\"或文本来源为\
            \ OCR 时，必须按 OCR 文本处理：允许存在断字、错空格、表格列错位、页眉页脚、页码、换行断句、单位与数值分离。\n2. PDF OCR\
            \ 中同一参数可能被拆成多行，例如\"锅炉最大排渣量\"在上一行、数值和单位在下一行；必须结合相邻 10 行、表头、上一章节标题、上一参数名和单位列综合判断。\n\
            3. OCR 表格可能丢失竖线或错列，不能只依赖 Markdown 表格格式；遇到连续的\"参数名 单位 数值\"或\"参数名 数值 单位\"\
            文本，也要抽取。\n4. OCR 可能把\"排渣量\"识别为\"排 渣 量\"、把\"下联箱\"识别为\"下 联 箱\"、把\"t/h\"\
            识别为\"t／h、t / h\"，这些都视为同义表达。\n5. PDF 页眉页脚、目录页、签字盖章页、文件编号、页码、日期、图号中的数字不得作为参数值；只有参数名/设备对象/单位/数值在相邻上下文中能绑定时才可抽取。\n\
            6. 证据溯源仍必须写原文附近可见位置；若 OCR 中章节号在相邻行或正文内嵌出现，如\"1.2.2\"或\"第1.2.2条\"，证据写\"\
            技术协议｜1.2.2｜原文短句\"。\n7. 对 PDF OCR，不能因为格式不像正式表格就填 null；正文句子、无框表、错列表、标题后的参数描述都要扫描。\n\
            \n# DOCX/Word 文档专项规则\n1. Word 表格常见结构是\"序号/项目/单位/数量/备注\"或\"设备名称/规格型号/单位/数量/备注\"\
            ，这些\"单位\"列只用于设备本身的数量统计（如渣井4套），**不能直接映射到技术参数**。\n2. Word 文档中技术参数（如\"每套渣斗排渣口数量\
            \ 3 个\"）通常出现在**正文段落**或**性能数据表**中，不是在设备清单的数量列里。\n3. **对于 slag_well_count**：必须回到正文中寻找\"\
            每套渣斗排渣口数量 3 个\"等字样，或技术数据表中\"锅炉渣井排渣口数量\"行，**不要**在设备清单表格的数量列中寻找。聊城祥光技术协议第6.1节技术数据表中明确有\"\
            每套渣斗排渣口数量：3个\"，提取该值。\n4. **对于 bolt_height_diff**：如果在文档中找不到明确值，检查是否有\"\
            L密封板自身高度=下膨胀量-螺栓高度差+25\"这样的计算公式，如果有下膨胀量和L密封板自身高度值，可以反推螺栓高度差。\n5. Word\
            \ 文档中常常没有章节号，证据溯源可写\"技术协议｜未标明章节｜原文短句\"。\n\n# 发布环境稳定性规则\n1. 只依据当前 user\
            \ 提示中显式提供的\"识别全文/当前分片内容/知识库文档全文/表A\"抽取；不要参考对话历史、上一轮回答、上传文件名或 sys.files\
            \ 附件对象。\n2. 如果当前输入中同时存在完整识别全文和分块内容，以当前节点 user 提示中标注的优先依据为准。\n3. 输出必须稳定、可重复；不要因为发布环境中的历史会话上下文改变参数值。\n\
            \n# 0716锥段角度专项规则\n1. 干渣仓锥段角度候选仅为60°、70°。若原文是精确值则尊重精确值；若仅写不小于60°/≥60°，60和70都满足时必须优选70°。"
