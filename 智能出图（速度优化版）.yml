    - data:
        code: "import re\nNL = chr(10)\nNULLS = {\"\", \"-\", \"null\", \"none\",\
          \ \"nan\", \"n/a\", \"na\", \"未识别\", \"待补充\", \"待确认\", \"未知\", \"未找到明确依据\"\
          }\nPARAM_META = [\n    (\"boiler_normal_slag_rate\", \"锅炉正常排渣量\", \"t/h\"\
          ),\n    (\"dry_slag_bulk_density\", \"干渣堆积密度\", \"t/m³\"),\n    (\"slag_well_max_storage_time\"\
          , \"渣井最大储渣时间\", \"h\"),\n    (\"slag_well_count\", \"渣井口数\", \"口\"),\n \
          \   (\"jv\", \"渣井总容积\", \"m³\"),\n    (\"max_slag_rate\", \"锅炉最大排渣量\", \"\
          t/h\"),\n    (\"boiler_capacity\", \"机组容量\", \"MW\"),\n    (\"comb_plate_length\"\
          , \"锅炉梳型密封板长度\", \"mm\"),\n    (\"comb_plate_width\", \"锅炉梳型密封板宽度\", \"\
          mm\"),\n    (\"boiler_down_expansion\", \"锅炉下膨胀量\", \"mm\"),\n    (\"t1\"\
          , \"下联箱标高\", \"mm\"),\n    (\"d1\", \"干渣仓仓体直径\", \"mm\"),\n    (\"cv1\"\
          , \"干渣仓有效容积\", \"m³\"),\n    (\"cone_included_angle\", \"干渣仓仓体锥段角度\", \"\
          °\"),\n    (\"unloading_type\", \"干渣仓卸料形式\", \"-\"),\n    (\"ground_height_diff\"\
          , \"车间内外高度差\", \"mm\"),\n    (\"transfer_floor_height\", \"渣仓转运层平台高度\",\
          \ \"mm\"),\n    (\"conveyor_silo_connection_type\", \"碎渣机连接装置连接管形式\", \"\
          -\"),\n    (\"boiler_silo_center_distance\", \"干渣仓中心线至锅炉中心线间距\", \"mm\"\
          ),\n    (\"unloading_form\", \"干渣仓卸料形式\", \"-\"),\n    (\"unloading_rate\"\
          , \"卸料出力\", \"t/h\"),\n    (\"bolt_height_diff\", \"锅炉梳型密封板连接螺栓高度差\", \"\
          mm\"),\n    (\"gate_platform_type\", \"关断门平台类型\", \"-\"),\n    (\"silo_platform_type\"\
          , \"渣仓转运层平台类型\", \"-\"),\n    (\"silo_ladder_component_type\", \"干渣仓扶梯组件类型\"\
          , \"-\"),\n]\nMETA = {key: (name, unit) for key, name, unit in PARAM_META}\n\
          ORDER = [key for key, _, _ in PARAM_META]\n\n\n# 仅这些参数允许在全部上传文档都未找到明确依据时给出推荐默认值。\n\
          # 参数值列保持无单位，来源列使用全角分隔符，避免破坏 Markdown 五列表格。\nRECOMMENDED_DEFAULTS = {\n \
          \   \"cone_included_angle\": (\"70\", \"技术协议｜未找到明确依据，推荐默认值｜默认70°\"),\n \
          \   \"unloading_type\": (\"双口卸料\", \"技术协议｜未找到明确依据，推荐默认值｜默认双口卸料\"),\n   \
          \ \"ground_height_diff\": (\"300\", \"技术协议｜未找到明确依据，推荐默认值｜默认300mm\"),\n \
          \   \"transfer_floor_height\": (\"4700\", \"技术协议｜未找到明确依据，推荐默认值｜默认4700mm\"\
          ),\n    \"conveyor_silo_connection_type\": (\"普通连接管\", \"技术协议｜未找到明确依据，推荐默认值｜默认普通连接管\"\
          ),\n    \"unloading_rate\": (\"100\", \"技术协议｜未找到明确依据，推荐默认值｜默认100t/h\"),\n\
          \    \"gate_platform_type\": (\"无平台\", \"技术协议｜未找到明确依据，推荐默认值｜默认无平台\"),\n\
          \    \"silo_platform_type\": (\"有出车端和后端\", \"技术协议｜未找到明确依据，推荐默认值｜默认有出车端和后端\"\
          ),\n    \"silo_ladder_component_type\": (\"常规扶梯组件\", \"技术协议｜未找到明确依据，推荐默认值｜默认常规扶梯组件\"\
          ),\n}\n\ndef _strip(value):\n    return str(value or \"\").strip()\n\ndef\
          \ _cell(value):\n    return _strip(value).replace(\"|\", \"｜\").replace(NL,\
          \ \" \") or \"-\"\n\ndef _normalize_evidence(value):\n    text = _strip(value)\n\
          \    text = text.replace(\"上传文档分块\", \"技术协议\").replace(\"上传文档分片\", \"技术协议\"\
          ).replace(\"上传文档\", \"技术协议\")\n    text = text.replace(\" | \", \"｜\").replace(\"\
          |\", \"｜\")\n    if not text:\n        return \"技术协议｜未找到明确依据\"\n    if not\
          \ text.startswith(\"技术协议\"):\n        text = \"技术协议｜\" + text\n    parts\
          \ = [part.strip() for part in text.split(\"｜\") if part.strip()]\n    if\
          \ len(parts) == 1:\n        return \"技术协议｜未找到明确依据\"\n    if len(parts) ==\
          \ 2:\n        loc = parts[1]\n        has_location = bool(re.search(r\"\
          (第.+章|第.+节|条款|表s*d|表d|d+(?:.d+)+)\", loc))\n        if not has_location\
          \ and \"未找到\" not in loc and \"无明确依据\" not in loc:\n            return \"\
          技术协议｜未标明章节｜\" + loc\n    return \"｜\".join(parts)\n\ndef _missing(value,\
          \ evidence=\"\"):\n    raw = _strip(value).lower()\n    if raw in NULLS:\n\
          \        return True\n    ev = _strip(evidence)\n    if \"推荐默认值\" in ev:\n\
          \        return False\n    return any(flag in ev for flag in (\"未找到\", \"\
          无明确依据\", \"缺失\", \"未提供\", \"未识别\"))\n\ndef _max_numeric_text(value):\n \
          \   text = _strip(value)\n    nums = re.findall(r\"(?<![\\d.])-?\\d+(?:\\\
          .\\d+)?\", text.replace(\",\", \"\"))\n    if not nums:\n        return\
          \ text\n    if len(nums) == 1:\n        return nums[0]\n    max_text = max(nums,\
          \ key=lambda item: float(item))\n    return max_text\n\ndef _normalize_value(value,\
          \ key=\"\"):\n    text = _strip(value)\n    if text.lower() in NULLS:\n\
          \        return text\n    unit = META.get(key, (\"\", \"-\"))[1]\n    if\
          \ unit == \"-\":\n        return text\n    has_multi_or_range = bool(re.search(r\"\
          [~～至到—–\\-、，,]\", text))\n    nums = re.findall(r\"(?<![\\d.])-?\\d+(?:\\\
          .\\d+)?\", text.replace(\",\", \"\"))\n    if has_multi_or_range and len(nums)\
          \ >= 2:\n        return _max_numeric_text(text)\n    return text\n\ndef\
          \ _number(value):\n    text = _normalize_value(value)\n    try:\n      \
          \  return float(str(text).replace(\",\", \"\"))\n    except Exception:\n\
          \        nums = re.findall(r\"(?<![\\d.])-?\\d+(?:\\.\\d+)?\", str(value).replace(\"\
          ,\", \"\"))\n        if nums:\n            return max(float(item) for item\
          \ in nums)\n        return None\n\ndef _extract_full_chain_from_evidence(evidence):\n\
          \    text = _strip(evidence)\n    if \"｜\" in text:\n        text = text.split(\"\
          ｜\")[-1]\n    if \"：\" in text:\n        text = text.split(\"：\", 1)[-1]\n\
          \    if \"即\" in text:\n        text = text.split(\"即\", 1)[-1]\n    candidates\
          \ = re.findall(r\"[^，。；;\\n｜|]*\\+[^，。；;\\n｜|]*\", text)\n    if not candidates:\n\
          \        return \"\"\n    return max([item.strip() for item in candidates],\
          \ key=len)\n\n\ndef _has_dry_unloading_signal(text):\n    t = _strip(text)\n\
          \    dry_keys = (\n        \"干式卸料\", \"干卸料\", \"干灰卸料\", \"干灰卸料机\", \"干式卸料机\"\
          ,\n        \"干灰散装机\", \"干式散装机\", \"汽车散装机\", \"干卸\",\n    )\n    return any(k\
          \ in t for k in dry_keys) or (\n        (\"干灰\" in t or \"干式\" in t) and\
          \ (\"卸料\" in t or \"散装机\" in t)\n    )\n\n\ndef _has_wet_unloading_signal(text):\n\
          \    t = _strip(text)\n    wet_keys = (\n        \"湿式卸料\", \"湿卸料\", \"湿式卸料机\"\
          , \"湿式搅拌机\", \"双轴搅拌机\", \"湿式搅拌\", \"湿卸\",\n    )\n    return any(k in t\
          \ for k in wet_keys) or (\n        \"湿式\" in t and (\"卸料\" in t or \"搅拌\"\
          \ in t)\n    )\n\n\ndef _normalize_unloading_form_value(value, evidence):\n\
          \    combined = f\"{value} {evidence}\"\n    dry = _has_dry_unloading_signal(combined)\n\
          \    wet = _has_wet_unloading_signal(combined)\n    if dry and wet:\n  \
          \      return \"干式卸料、湿式卸料\"\n    if dry:\n        return \"干式卸料\"\n    if\
          \ wet:\n        return \"湿式卸料\"\n    return value\n\n\ndef _normalize_cone_preference(value,\
          \ evidence):\n    text = f\"{_strip(value)} {_strip(evidence)}\".replace(\"\
          \ \", \"\")\n    numbers = re.findall(r\"(?<![\\d.])-?\\d+(?:\\.\\d+)?\"\
          , text)\n    number = float(numbers[0]) if numbers else None\n    if re.search(r\"\
          不小于|不得小于|至少|≥|>=\", text) and number is not None:\n        if number <=\
          \ 70:\n            return \"70\"\n    if re.search(r\"不大于|不得大于|至多|≤|<=\"\
          , text) and number is not None:\n        if number >= 60:\n            return\
          \ \"60\"\n    if number in (60, 70):\n        return str(int(number))\n\
          \    return value\n\n\ndef _fix_textual_row(row):\n    key = row.get(\"\
          key\", \"\")\n    if key == \"n\":\n        return None\n    value = _strip(row.get(\"\
          value\", \"\"))\n    evidence = _strip(row.get(\"evidence\", \"\"))\n  \
          \  if key == \"cone_included_angle\":\n        row[\"value\"] = _normalize_cone_preference(value,\
          \ evidence)\n    if key == \"unloading_form\":\n        row[\"value\"] =\
          \ _normalize_unloading_form_value(value, evidence)\n    if key == \"conveyor_silo_connection_type\"\
          :\n        chain = _extract_full_chain_from_evidence(evidence)\n       \
          \ if chain and (len(chain) > len(value)) and (not value or value in chain\
          \ or \"+\" in value):\n            row[\"value\"] = chain\n    return row\n\
          \ndef _coerce_param_cells(cells):\n    cells = [cell.strip() for cell in\
          \ cells]\n    if len(cells) <= 5:\n        return cells\n    if not re.match(r\"\
          ^[A-Za-z_][A-Za-z0-9_]*$\", cells[0]):\n        return cells\n    return\
          \ cells[:4] + [\"｜\".join(part.replace(\"|\", \"｜\") for part in cells[4:])]\n\
          \ndef _repair_misaligned_row(row):\n    key = row.get(\"key\", \"\")\n \
          \   value = _strip(row.get(\"value\", \"\"))\n    unit = _strip(row.get(\"\
          unit\", \"\"))\n    evidence = _strip(row.get(\"evidence\", \"\"))\n   \
