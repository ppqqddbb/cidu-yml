    - data:
        code: "import json\n\n\ndef _as_dict(value) -> dict:\n    return value if\
          \ isinstance(value, dict) else {}\n\n\ndef _clean(value) -> str:\n    return\
          \ str(value or \"\").strip()\n\n\ndef _load_json(value: str) -> dict:\n\
          \    text = _clean(value)\n    if not text:\n        return {}\n    try:\n\
          \        data = json.loads(text)\n        return data if isinstance(data,\
          \ dict) else {}\n    except Exception:\n        return {}\n\n\ndef _score_signals(signals:\
          \ dict) -> int:\n    signals = _as_dict(signals)\n    if not signals:\n\
          \        return 0\n    score = 0\n    if _clean(signals.get(\"intent\")):\n\
          \        score += 2\n    if _as_dict(signals.get(\"selection_confirmed_candidate\"\
          )):\n        score += 8\n    if signals.get(\"previous_candidates\"):\n\
          \        score += 4\n    if signals.get(\"model_name_hints\") or signals.get(\"\
          template_hints\"):\n        score += 3\n    if signals.get(\"keywords\"\
          ):\n        score += 2\n    if signals.get(\"selection_qualifiers\"):\n\
          \        score += 2\n    if _as_dict(signals.get(\"extracted_parameters\"\
          )):\n        score += 2\n    return score\n\n\ndef main(\n    preflight_signals:\
          \ str = \"\",\n    enriched_signals: str = \"\",\n    preflight_retrieval_query:\
          \ str = \"\",\n    enriched_retrieval_query: str = \"\",\n) -> dict:\n \
          \   preflight = _load_json(preflight_signals)\n    enriched = _load_json(enriched_signals)\n\
          \    use_enriched = _score_signals(enriched) >= _score_signals(preflight)\
          \ and bool(enriched)\n    chosen = enriched if use_enriched else preflight\n\
          \    if not chosen:\n        chosen = {\"intent\": \"new_selection\"}\n\
          \    retrieval_query = _clean(enriched_retrieval_query if use_enriched else\
          \ preflight_retrieval_query)\n    if not retrieval_query:\n        terms\
          \ = []\n        text = _clean(chosen.get(\"text\"))\n        if text:\n\
          \            terms.append(text)\n        for key in (\"model_name_hints\"\
          , \"template_hints\", \"keywords\", \"context_terms\", \"category_expansion_terms\"\
          ):\n            for item in chosen.get(key) or []:\n                if isinstance(item,\
          \ str):\n                    value = _clean(item)\n                    if\
          \ value and value not in terms:\n                        terms.append(value)\n\
          \        if terms:\n            retrieval_query = \" \".join(terms)\n  \
          \  return {\n        \"signals_json\": json.dumps(chosen, ensure_ascii=False,\
          \ separators=(\",\", \":\")),\n        \"intent\": _clean(chosen.get(\"\
          intent\")) or \"new_selection\",\n        \"retrieval_query\": retrieval_query,\n\
          \        \"empty_retrieval_result\": [],\n    }"
