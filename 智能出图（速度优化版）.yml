          \ saved_param, saved_external, supplement_query, edit_kind, intent)\n  \
          \  if not query:\n        return _payload(\"message\", \"请输入要查询外购件、查看参数表、修改历史表格或开始计算的要求。\"\
          , text, query, edit_table, saved_param, saved_external, supplement_query,\
