          \ = dict(intent)\n        intent[\"route\"] = \"message\"\n        intent[\"\
          operation_summary\"] = \"用户输入“选型计算”，展示自动提取的参数表\"\n    edit_table, edit_kind\
          \ = _choose_edit_table(query, intent, saved_last, saved_param, saved_external)\n\
