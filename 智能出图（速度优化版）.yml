          :\n        if not saved_param:\n            return _payload(\"message\"\
          , \"当前还没有可用于计算的参数表。请先上传文档完成参数提取，必要时手动修改参数，然后输入“开始计算”。\", text, query, edit_table,\
          \ saved_param, saved_external, supplement_query, edit_kind, intent)\n  \
