    - data:
        code: "import json\nimport re\n\n\ndef _clean(value):\n    return str(value\
          \ or \"\").strip()\n\n\ndef _compact(value):\n    return re.sub(r\"\\s+\"\
          , \"\", _clean(value)).lower()\n\n\nCN_NUM = {\n    \"零\": 0, \"一\": 1,\
          \ \"二\": 2, \"两\": 2, \"三\": 3, \"四\": 4, \"五\": 5,\n    \"六\": 6, \"七\"\
          : 7, \"八\": 8, \"九\": 9, \"十\": 10,\n}\n\n\ndef _cn_number_to_int(text:\
          \ str) -> int:\n    text = _clean(text)\n    if not text:\n        return\
          \ 0\n    if text.isdigit():\n        return int(text)\n    if text in CN_NUM:\n\
          \        return CN_NUM[text]\n    if text.startswith(\"十\"):\n        tail\
          \ = text[1:]\n        if not tail:\n            return 10\n        return\
          \ 10 + CN_NUM.get(tail, 0)\n    if \"十\" in text:\n        left, _, right\
          \ = text.partition(\"十\")\n        left_v = CN_NUM.get(left, 0) if left\
          \ else 1\n        right_v = CN_NUM.get(right, 0) if right else 0\n     \
          \   return left_v * 10 + right_v\n    return 0\n\n\ndef _selection_indices(query:\
          \ str) -> list:\n    compact = _compact(query)\n    if not compact:\n  \
          \      return []\n    single = r\"^(?:选|选择|确认|确定|就用|采用|使用)?第?([0-9一二两三四五六七八九十]+)(?:个|项|号|款|模型)?$\"\
          \n    match = re.fullmatch(single, compact)\n    if match:\n        idx\
          \ = _cn_number_to_int(match.group(1))\n        return [idx] if idx > 0 else\
          \ []\n    if compact.isdigit():\n        idx = int(compact)\n        return\
          \ [idx] if idx > 0 else []\n    body = re.sub(r\"^(?:选|选择|确认|确定|就用|采用|使用|同时|一起|都|全部|帮我|请|我要|我选|我选择)\"\
          , \"\", compact)\n    body = re.sub(r\"(?:都要|都生成|都输出|一起生成|一起输出|全部生成|全部输出|这几个|这些|候选|模型)$\"\
          , \"\", body)\n    token = r\"第?([0-9一二两三四五六七八九十]+)(?:个|项|号|款|模型)?\"\n \
          \   multi = r\"^(?:第?[0-9一二两三四五六七八九十]+(?:个|项|号|款|模型)?)(?:(?:和|与|及|、|,|，|;|；|\\\
          +|以及)(?:第?[0-9一二两三四五六七八九十]+(?:个|项|号|款|模型)?))+$\"\n    if re.fullmatch(multi,\
          \ body):\n        result = []\n        for item in re.findall(token, body):\n\
          \            idx = _cn_number_to_int(item)\n            if idx > 0 and idx\
          \ not in result:\n                result.append(idx)\n        return result\n\
          \    return []\n\n\ndef _load_candidates(candidates_json: str) -> list:\n\
          \    text = _clean(candidates_json)\n    if not text:\n        return []\n\
          \    try:\n        data = json.loads(text)\n    except Exception:\n    \
          \    return []\n    if isinstance(data, list):\n        return [item for\
          \ item in data if isinstance(item, dict)]\n    if isinstance(data, dict):\n\
          \        items = data.get(\"cidu_selection_candidates\") or data.get(\"\
          candidates\") or []\n        return [item for item in items if isinstance(item,\
          \ dict)]\n    return []\n\n\ndef _candidate_name(item: dict) -> str:\n \
          \   for key in (\"model_name\", \"name\", \"model_id\", \"template_name\"\
          ):\n        value = _clean(item.get(key))\n        if value:\n         \
          \   return value\n    return \"\"\n\n\ndef _candidate_template(item: dict)\
          \ -> str:\n    return _clean(item.get(\"template_name\") or item.get(\"\
          model_id\"))\n\n\ndef _candidate_path(item: dict) -> str:\n    return _clean(item.get(\"\
          full_node_path\") or item.get(\"node_path\") or item.get(\"graph_path\"\
          ))\n\n\ndef _pick_candidate(candidates: list, index: int) -> dict:\n   \
          \ for item in candidates:\n        try:\n            if int(item.get(\"\
          index\", 0)) == index:\n                return item\n        except Exception:\n\
          \            pass\n    if 1 <= index <= len(candidates):\n        return\
          \ candidates[index - 1]\n    return {}\n\n\ndef _format_confirmed(candidate:\
          \ dict, choice_text: str) -> str:\n    name = _candidate_name(candidate)\n\
          \    template = _candidate_template(candidate)\n    full_path = _candidate_path(candidate)\n\
          \    lines = [\"## 已确认模型\"]\n    if name:\n        lines.append(f\"**模型**：{name}\"\
          )\n    else:\n        lines.append(\"还没有确认模型，请回复上一轮候选编号。\")\n    if template\
          \ and template != name:\n        lines.append(f\"**模板名称**：{template}\")\n\
          \    if full_path:\n        lines.append(f\"**完整节点线路**：{full_path}\")\n\
          \    lines.append(\"**置信度**：100%\")\n    lines.append(\"**检索来源**：上一轮候选列表（编号确认，未重复调用混合检索）\"\
          )\n    if choice_text:\n        lines.append(f\"**确认编号**：{choice_text}\"\
          )\n    lines.extend([\"\", \"如需继续生成模型，请补充该模型所需参数，或输入“使用默认值”。\"])\n    return\
          \ \"\\n\".join(lines)\n\n\ndef main(query: str = \"\", candidates_json:\
          \ str = \"\") -> dict:\n    choices = _selection_indices(query)\n    if\
          \ not choices:\n        return {\n            \"answer\": \"## 无法确认模型\\\
          n请直接回复候选编号，例如 `1`、`2` 或 `选第 3 个`。\"\n        }\n    candidates = _load_candidates(candidates_json)\n\
          \    if not candidates:\n        return {\n            \"answer\": \"##\
          \ 无法确认模型\\n未找到上一轮候选列表。请先输入设计需求，例如“设计一个斜梯”，待系统给出候选后再回复编号。\"\n        }\n\
          \    chosen = _pick_candidate(candidates, choices[0])\n    if not chosen:\n\
          \        return {\n            \"answer\": f\"## 无法确认模型\\n编号 `{choices[0]}`\
          \ 超出候选范围（共 {len(candidates)} 个）。请重新输入有效编号。\"\n        }\n    return {\"\
          answer\": _format_confirmed(chosen, _clean(query))}\n"
