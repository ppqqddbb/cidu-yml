          ):\n            skipping = True\n            continue\n        if skipping\
          \ and stripped.startswith(\"## \"):\n            skipping = False\n    \
          \    if skipping:\n            continue\n        lines.append(line)\n  \
          \  return \"\\n\".join(lines).strip()\n\n\ndef _selection_row_key(line:\
          \ str) -> str:\n    if \"|\" not in line or \"---\" in line:\n        return\
          \ \"\"\n    cells = [cell.strip() for cell in line.strip().strip(\"|\").split(\"\
