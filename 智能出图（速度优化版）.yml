          \             target[dst] = row[src]\n            existing_rows[existing_index[key]]\
          \ = target\n        else:\n            padded = [\"-\"] * len(existing_headers)\n\
          \            for field in (\"key\", \"name\", \"value\", \"unit\", \"evidence\"\
