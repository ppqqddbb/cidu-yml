          \    if name in (\"参数名称\", \"参数\", \"设备名称\", \"序号\"):\n        return \"\
          \"\n    # 忽略无意义的空格差异，但不合并名称本身不同的参数。\n    return \"\".join(name.split()).lower()\n\
          \n\ndef _deduplicate_selection_rows(markdown: str) -> str:\n    \"\"\"设备选型结果按参数名称去重；保留最后一行作为最终回填结果。\"\
          \"\"\n    text = _strip(markdown)\n    if not text or \"## 设备选型结果\" not\
          \ in text:\n        return text\n    lines = text.splitlines()\n    last_index_by_key\
          \ = {}\n    in_selection_section = False\n    for index, line in enumerate(lines):\n\
