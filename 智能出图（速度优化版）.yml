          \            continue\n        lines.append(line)\n    return \"\\n\".join(lines).strip()\n\
          \n\ndef _hide_calculation_process_section(markdown: str) -> str:\n    \"\
          \"\"隐藏“计算过程”整段，避免在对话结果中展开公式代入明细。\"\"\"\n    text = _strip(markdown)\n  \
          \  if not text or \"## 计算过程\" not in text:\n        return text\n    lines\
          \ = []\n    skipping = False\n    for line in text.splitlines():\n     \
