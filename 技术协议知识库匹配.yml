    - data:
        code: "import re\n\nCHUNK_CHARS = 3000\nCHUNK_OVERLAP = 160\nBOUNDARY_SEARCH_CHARS\
          \ = 250\n\ndef _file_name(file_value):\n    if isinstance(file_value, list):\n\
          \        file_value = file_value[0] if file_value else {}\n    if isinstance(file_value,\
          \ dict):\n        return str(\n            file_value.get(\"name\")\n  \
          \          or file_value.get(\"filename\")\n            or file_value.get(\"\
          title\")\n            or \"待匹配文件\"\n        )\n    return \"待匹配文件\"\n\n\
          def _clean(text):\n    if isinstance(text, list):\n        text = \"\\n\"\
          .join(str(item or \"\") for item in text)\n    text = str(text or \"\").replace(\"\
          \\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\")\n    lines = [re.sub(r\"\\\
          s+\", \" \", line).strip() for line in text.split(\"\\n\")]\n    return\
          \ \"\\n\".join(line for line in lines if line)\n\ndef _split_document(text):\n\
          \    \"\"\"Split text into chunks of approximately CHUNK_CHARS characters,\
          \ no upper limit on chunk count.\"\"\"\n    length = len(text)\n    if not\
          \ length:\n        return []\n    chunk_count = max(1, (length + CHUNK_CHARS\
          \ - 1) // CHUNK_CHARS)\n    chunks = []\n    start = 0\n    for index in\
          \ range(chunk_count):\n        if index == chunk_count - 1:\n          \
          \  cut = length\n        else:\n            ideal_cut = ((index + 1) * length)\
          \ // chunk_count\n            window_start = max(start + 1, ideal_cut -\
          \ BOUNDARY_SEARCH_CHARS)\n            cut = text.rfind(\"\\n\", window_start,\
          \ ideal_cut + 1)\n            if cut <= start:\n                cut = ideal_cut\n\
          \        query_chunk = text[max(0, start - CHUNK_OVERLAP):cut].strip()\n\
          \        if query_chunk:\n            chunks.append(query_chunk)\n     \
          \   start = cut\n    return chunks\n\ndef main(reference_file, document_text)\
          \ -> dict:\n    body = _clean(document_text)\n    chunks = _split_document(body)\
          \ if body else []\n    return {\n        \"reference_name\": _file_name(reference_file),\n\
          \        \"source_ready\": bool(body),\n        \"retrieval_queries\": chunks,\n\
          \        \"source_chunk_count\": len(chunks),\n    }\n"
        code_language: python3
        outputs:
          reference_name:
            children: null
            type: string
          retrieval_queries:
            children: null
            type: array[string]
          source_chunk_count:
            children: null
            type: number
          source_ready:
            children: null
            type: boolean
        selected: false
        title: 切分上传文档全文
        type: code
        variables:
        - value_selector:
          - sys
          - files
          variable: reference_file
        - value_selector:
          - document_extractor
          - text
          variable: document_text
