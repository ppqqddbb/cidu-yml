    - data:
        code: "import json\n\ndef main(retrieval_results) -> dict:\n    # Emit one\
          \ JSON value for every upload chunk, including empty retrievals.\n    #\
          \ This preserves the denominator required for full-document coverage.\n\
          \    if isinstance(retrieval_results, str):\n        try:\n            retrieval_results\
          \ = json.loads(retrieval_results)\n        except Exception:\n         \
          \   retrieval_results = []\n    return {\"chunk_matches\": json.dumps(retrieval_results\
          \ or [], ensure_ascii=False)}\n"
        code_language: python3
        outputs:
          chunk_matches:
            children: null
            type: string
        selected: false
        title: 保留当前分段检索结果
        type: code
        variables:
        - value_selector:
          - chunk_knowledge_retrieval
          - result
          variable: retrieval_results
      extent: parent
      height: 52
      id: chunk_result_serializer
      parentId: document_chunk_iteration
      position:
        x: 505
        y: 97.83333333333334
      positionAbsolute:
        x: 1529
        y: 97.83333333333334
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 1002
    - data:
        code: "import json\n\nTOP_DOCUMENTS = 10\n\ndef _records(value):\n    \"\"\
          \"Read a single upload-chunk retrieval result across Dify result formats.\"\
          \"\"\n    if isinstance(value, str):\n        try:\n            return _records(json.loads(value))\n\
          \        except Exception:\n            return []\n    if isinstance(value,\
          \ list):\n        return [item for item in value if isinstance(item, dict)]\n\
          \    if not isinstance(value, dict):\n        return []\n    for key in\
          \ (\"result\", \"records\", \"data\", \"items\", \"documents\", \"retrieval_results\"\
          ):\n        nested = value.get(key)\n        if isinstance(nested, (list,\
          \ dict, str)):\n            records = _records(nested)\n            if records:\n\
          \                return records\n    return [value]\n\ndef _first_text(values,\
          \ default=\"\"):\n    for value in values:\n        if value is not None\
          \ and str(value).strip():\n            return str(value).strip()\n    return\
          \ default\n\ndef _document_name(record):\n    metadata = record.get(\"metadata\"\
          ) or record.get(\"document_metadata\") or {}\n    document = record.get(\"\
          document\") or record.get(\"source_document\") or {}\n    if not isinstance(metadata,\
          \ dict):\n        metadata = {}\n    if not isinstance(document, dict):\n\
          \        document = {}\n    return _first_text((\n        record.get(\"\
          document_name\"), record.get(\"document_title\"), record.get(\"title\"),\n\
          \        record.get(\"name\"), record.get(\"filename\"), record.get(\"file_name\"\
          ),\n        document.get(\"name\"), document.get(\"document_name\"), document.get(\"\
          title\"),\n        metadata.get(\"document_name\"), metadata.get(\"document_title\"\
          ), metadata.get(\"title\"),\n        metadata.get(\"file_name\"), metadata.get(\"\
          filename\"), metadata.get(\"source_name\"),\n    ), \"知识库文档（未返回文件名）\")\n\
          \ndef _score(record):\n    metadata = record.get(\"metadata\") if isinstance(record.get(\"\
          metadata\"), dict) else {}\n    for key in (\"score\", \"retrieval_score\"\
          , \"similarity\", \"relevance_score\"):\n        try:\n            value\
          \ = float(record.get(key, metadata.get(key)))\n            if value > 1:\n\
          \                value /= 100.0\n            return max(0.0, min(1.0, value))\n\
          \        except (TypeError, ValueError):\n            pass\n    return None\n\
          \ndef _median(values):\n    ordered = sorted(values)\n    middle = len(ordered)\
          \ // 2\n    if len(ordered) % 2:\n        return ordered[middle]\n    return\
          \ (ordered[middle - 1] + ordered[middle]) / 2.0\n\ndef _cell(value):\n \
          \   return str(value or \"\").replace(\"|\", \"\\\\|\").replace(\"\\n\"\
          , \" \")\n\ndef main(source_ready, source_chunk_count, chunk_match_results)\
          \ -> dict:\n    if not source_ready:\n        return {\"result\": \"上传文件未提取到可检索正文，暂无法进行知识库匹配。请上传可复制文本的\
          \ DOC、DOCX 或 PDF，扫描件请先完成 OCR。\"}\n\n    expected_chunks = max(int(source_chunk_count\
          \ or 0), 0)\n    if isinstance(chunk_match_results, list):\n        raw_chunks\
          \ = chunk_match_results\n    elif isinstance(chunk_match_results, str):\n\
          \        raw_chunks = [chunk_match_results]\n    else:\n        raw_chunks\
          \ = []\n    total_chunks = max(expected_chunks, len(raw_chunks))\n    if\
          \ total_chunks == 0:\n        return {\"result\": \"上传文件未生成可检索分段，暂无法进行全文匹配。\"\
          }\n\n    # For each upload chunk, retain only the best hit for each candidate\
          \ document.\n    # Missing candidate/chunk pairs remain zero and therefore\
          \ reduce whole-document score.\n    chunk_maps = []\n    readable_records\
          \ = 0\n    for raw_chunk in raw_chunks:\n        matches = {}\n        for\
          \ record in _records(raw_chunk):\n            score = _score(record)\n \
          \           if score is None:\n                continue\n            readable_records\
          \ += 1\n            name = _document_name(record)\n            matches[name]\
          \ = max(matches.get(name, 0.0), score)\n        chunk_maps.append(matches)\n\
          \    while len(chunk_maps) < total_chunks:\n        chunk_maps.append({})\n\
          \n    document_scores = {}\n    for index, matches in enumerate(chunk_maps):\n\
          \        for name, score in matches.items():\n            if name not in\
          \ document_scores:\n                document_scores[name] = [0.0] * total_chunks\n\
          \            document_scores[name][index] = score\n\n    if not document_scores:\n\
          \        return {\n            \"result\": (\n                \"未获得可用于全文匹配的知识库结果。上传分段数：%d；已返回检索结果的分段数：%d；可读取分数的记录数：%d。\\\
          n\\n\"\n                \"请确认“检索当前上传分段”节点已绑定正确知识库，并确认知识库文档已完成索引。\"\n   \
          \         ) % (total_chunks, len(raw_chunks), readable_records)\n      \
          \  }\n\n    ranking = []\n    for name, scores in document_scores.items():\n\
          \        hit_scores = [score for score in scores if score > 0]\n       \
          \ overall_similarity = sum(scores) / total_chunks          # 全文平均相似度\n \
          \       coverage = len(hit_scores) / float(total_chunks)         # 覆盖率\n\
          \        stability = _median(scores)                              # 稳定性（中位数）\n\
          \        best = max(scores)\n        hit_quality = sum(hit_scores) / len(hit_scores)\
          \ if hit_scores else 0\n\n        # 综合匹配度：兼顾全文平均相似度、分段覆盖率、稳定性和最佳局部匹配\n \
          \       match = (\n            0.55 * overall_similarity\n            +\
          \ 0.30 * coverage * hit_quality\n            + 0.10 * stability\n      \
          \      + 0.05 * best\n        )\n        ranking.append((match, name))\n\
          \n    ranking.sort(reverse=True)\n    lines = [\"| 匹配文件名称 | 匹配度 |\", \"\
          | :--- | ---: |\"]\n    for match, name in ranking[:TOP_DOCUMENTS]:\n  \
          \      lines.append(\"| %s | %.2f%% |\" % (_cell(name), match * 100))\n\
          \    return {\"result\": \"\\n\".join(lines)}\n"
        code_language: python3
        outputs:
          result:
            children: null
            type: string
        selected: false
        title: 聚合文件匹配度
        type: code
        variables:
        - value_selector:
          - query_builder
          - source_ready
          variable: source_ready
        - value_selector:
          - query_builder
          - source_chunk_count
          variable: source_chunk_count
        - value_selector:
          - document_chunk_iteration
          - output
          variable: chunk_match_results
      height: 52
      id: score_aggregator
      position:
        x: 1930
        y: 154.5
      positionAbsolute:
        x: 1930
        y: 154.5
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
