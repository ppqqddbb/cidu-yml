    - data:
        code: "import json\n\ndef _pick_text(raw):\n    text = str(raw or \"\").strip()\n\
          \    if not text:\n        return \"\"\n    try:\n        data = json.loads(text)\n\
          \    except Exception:\n        return text\n    if isinstance(data, dict):\n\
          \        for key in (\"markdown_content\", \"markdown\", \"text\", \"content\"\
          , \"result\", \"output\"):\n            value = data.get(key)\n        \
          \    if isinstance(value, str) and value.strip():\n                return\
          \ value.strip()\n        return text\n    if isinstance(data, list):\n \
          \       parts = []\n        for item in data:\n            picked = _pick_text(json.dumps(item,\
          \ ensure_ascii=False))\n            if picked:\n                parts.append(picked)\n\
          \        return \"\\n\".join(parts).strip()\n    return text\n\ndef main(ocr_text:\
          \ str = \"\", doc_text: str = \"\") -> dict:\n    ocr_value = _pick_text(ocr_text)\n\
          \    doc_value = _pick_text(doc_text)\n    recognized_text = ocr_value or\
          \ doc_value\n    recognized_source = \"ocr\" if ocr_value else (\"doc\"\
          \ if doc_value else \"none\")\n    return {\n        \"recognized_text\"\
          : recognized_text,\n        \"recognized_source\": recognized_source,\n\
          \    }"
        code_language: python3
        desc: 统一解析 OCR 与文档提取器输出。
        outputs:
          recognized_source:
            children: null
            type: string
          recognized_text:
            children: null
            type: string
